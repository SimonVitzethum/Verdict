# Verdict QEMU-Test: unbeaufsichtigte Debian-13-Installation (nur lokale Test-VM,
# Passwoerter trivial, nichts davon verlaesst 127.0.0.1; Datei liegt in /tmp, nie im Repo).
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/layoutcode string de
d-i keyboard-configuration/xkb-keymap select de

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string verdict-test
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password verdict
d-i passwd/root-password-again password verdict
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin

d-i partman-auto/method string regular
d-i partman-auto/choose_device select /dev/vda
d-i partman-auto/disk string /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i grub-installer/bootdev string /dev/vda
d-i grub-installer/only_debian boolean true

d-i tasksel/first multiselect standard
d-i pkgsel/include string openssh-server nftables iproute2 curl netcat-openbsd python3 strace tcpdump
d-i pkgsel/upgrade select full-upgrade

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true

# Serielle Konsole (QEMU -nographic) + SSH als root fuer den Test.
d-i preseed/late_command string \
  in-target sed -i -e 's/^#*GRUB_TERMINAL=.*/GRUB_TERMINAL="console serial"/' -e 's/^GRUB_CMDLINE_LINUX=.*/GRUB_CMDLINE_LINUX="console=ttyS0,115200n8"/' /etc/default/grub ; \
  in-target update-grub ; \
  in-target sed -i -e 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' -e 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
